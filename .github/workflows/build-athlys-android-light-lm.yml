name: Build Athlys Light LM Android test
on:
  push:
    branches: [build/android-light-lm-test-20261121]
    paths: ['.github/workflows/build-athlys-android-light-lm.yml', 'android-light-lm-web-input.json']
  workflow_dispatch:

concurrency:
  group: athlys-android-light-lm-test-20261121
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      MODEL_REVISION: 657e078c94084481950a2d555a941481f715536b
      MODEL_SHA256: 85e32858daafad55b7bcd6b97a1343ee0661188e8036f9862d14d6b563142f50
      LICENSE_SHA256: 5188f2b355da20647257a3156db5834c794e5fb5e6d8dc4d4cdbb3180e75b85b
      WASM_SHA256: 79ac5be917b71d50571a4f584436a9f6baf6b6e57719d094ed8bd950e9a65780
      PUBLIC_WEB: https://athlys-v6-pwa.vercel.app
      RELEASE_TAG: android-light-lm-test-20261121
      APK: Athlys-Light-LM-Android-test.apk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Retrieve verified public Athlys assets
        run: |
          python - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          entries = json.loads(Path("android-light-lm-web-input.json").read_text())
          def retrieve(entry):
              name = entry["file"]
              target = Path("web") / name
              with urllib.request.urlopen(os.environ["PUBLIC_WEB"] + "/" + name, timeout=35) as response:
                  content = response.read()
              assert len(content) == entry["size"] and hashlib.sha1(content).hexdigest() == entry["sha"], name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              list(pool.map(retrieve, entries))
          PY
      - name: Prepare Capacitor Android test app
        run: |
          cat > package.json <<'JSON'
          {"name":"athlys-light-lm-test","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"7.6.10","@capacitor/cli":"7.6.10","@capacitor/core":"7.6.10","@capacitor/app":"7.1.2","@capacitor/local-notifications":"7.0.7","@capacitor/splash-screen":"7.0.5","@capgo/capacitor-health":"7.0.2","@wllama/wllama":"3.13.0"}}
          JSON
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.athlys.app","appName":"Athlys Light LM","webDir":"web","server":{"androidScheme":"https"}}
          JSON
          npm install --no-audit --no-fund
          mv web/athlys-light-lm/assistant-android.js web/athlys-light-lm/assistant.js
          sed -i 's@/athlys-light-lm/assistant-web.js@/athlys-light-lm/assistant.js@' web/mobile.html
          cp web/mobile.html web/index.html
          sed -i 's@/athlys-light-lm/assistant-web.js@/athlys-light-lm/assistant.js@' web/sw.js
          npx cap add android
      - name: Embed verified weights and WebAssembly
        run: |
          public=android/app/src/main/assets/public/athlys-light-lm
          model_root="https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/${MODEL_REVISION}"
          curl --fail --silent --show-error --location --retry 4 --max-time 300 "${model_root}/LFM2.5-350M-Q4_0.gguf" --output "${public}/model.gguf"
          curl --fail --silent --show-error --location --retry 4 --max-time 60 "${model_root}/LICENSE" --output "${public}/LFM-LICENSE"
          cp node_modules/@wllama/wllama/esm/wasm/wllama.wasm "${public}/wllama.wasm"
          cp node_modules/@wllama/wllama/LICENCE "${public}/wllama-LICENSE"
          sha256sum -c <<CHECKSUMS
          ${MODEL_SHA256}  ${public}/model.gguf
          ${LICENSE_SHA256}  ${public}/LFM-LICENSE
          ${WASM_SHA256}  ${public}/wllama.wasm
          CHECKSUMS
      - name: Configure Android 8+ debug package and official icon
        run: |
          python -m pip install --quiet pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image, ImageOps

          root = Path("android")
          gradle = root / "app" / "build.gradle"
          s = gradle.read_text()
          build_types = "    buildTypes {"
          assert s.count(build_types) == 1
          s = s.replace("android {", """android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              androidResources { noCompress += ['gguf', 'wasm'] }""", 1)
          s = s.replace(build_types, build_types + """
                  debug {
                      applicationIdSuffix '.lightlm'
                      versionNameSuffix '-light-lm'
                  }""")
          s = s.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'", 1)
          gradle.write_text(s)
          variables = root / "variables.gradle"
          source, count = re.subn(r"(minSdkVersion\s*=\s*)\d+", r"\g<1>26", variables.read_text())
          assert count == 1
          variables.write_text(source)

          icon = Image.open("web/assets/athlys-logo.png").convert("RGBA")
          resources = root / "app" / "src" / "main" / "res"
          for density, size in {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}.items():
              folder = resources / f"mipmap-{density}"
              folder.mkdir(exist_ok=True)
              resized = ImageOps.fit(icon, (size, size), method=Image.Resampling.LANCZOS)
              for name in ("ic_launcher", "ic_launcher_round"):
                  resized.save(folder / (name + ".png"))
          adaptive = resources / "mipmap-anydpi-v26"
          if adaptive.is_dir():
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  (adaptive / name).unlink(missing_ok=True)
          PY
      - name: Build Android test APK
        working-directory: android
        run: bash gradlew :app:assembleDebug --no-daemon
      - name: Verify the APK before publication
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          test "$(stat --format=%s "$APK")" -lt 250000000
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > apk-badging.txt
          grep -F "name='com.athlys.app.lightlm'" apk-badging.txt
          grep -F "sdkVersion:'26'" apk-badging.txt
          python - <<'PY'
          import hashlib, os
          import zipfile
          with zipfile.ZipFile(os.environ["APK"]) as apk:
              base = "assets/public/athlys-light-lm/"
              for name, key in [("model.gguf", "MODEL_SHA256"), ("wllama.wasm", "WASM_SHA256"), ("LFM-LICENSE", "LICENSE_SHA256")]:
                  with apk.open(base + name) as data:
                      assert hashlib.file_digest(data, "sha256").hexdigest() == os.environ[key], name
              assert b'/athlys-light-lm/assistant.js' in apk.read("assets/public/index.html")
              assert apk.getinfo(base + "assistant.js").file_size > 100_000
          PY
          sha256sum "$APK" > "${APK}.sha256"
      - name: Publish a separate test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$APK" "${APK}.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Athlys Light LM — APK Android de test' \
            --notes 'Version de test pour Android 8 ou ultérieur. Le modèle LFM2.5-350M est inclus et génère sur le téléphone. Signature de test et identifiant d’application séparé.'
