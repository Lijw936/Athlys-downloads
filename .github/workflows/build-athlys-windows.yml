name: Build and publish Athlys Windows and Athlys Club (public source, native Windows runner)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-athlys-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout sanitized public Athlys source
        uses: actions/checkout@v4
        with:
          repository: Lijw936/Athlys-downloads
          ref: build/athlys-public-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon tooling
        run: python -m pip install --quiet Pillow
      - name: Create Athlys Windows icons
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          for source, target in [('web/assets/athlys-logo.png','desktop/athlys.ico'),('web/assets/athlys-logo.png','desktop-club/athlys.ico')]:
              Image.open(source).convert('RGBA').save(target, format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          PY
      - name: Validate desktop applications and loader
        run: |
          (cd desktop && npm run check)
          (cd desktop-club && npm run check)
          node --test web/mobile-experience.test.cjs
      - name: Build Athlys Desktop Windows packages
        working-directory: desktop
        run: |
          npm install --prefer-online --no-audit --no-fund
          npm run dist
          test -s dist/Athlys-1.2.1-x64.exe
          test -s dist/Athlys-Portable-1.2.1-x64.exe
      - name: Build Athlys Club Windows packages
        working-directory: desktop-club
        run: |
          npm install --prefer-online --no-audit --no-fund
          npm run dist
          test -s dist/Athlys-Club-1.0.1-x64.exe
          test -s dist/Athlys-Club-Portable-1.0.1-x64.exe
      - name: Publish Athlys Desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/desktop
          cp desktop/dist/Athlys-1.2.1-x64.exe desktop/dist/Athlys-Portable-1.2.1-x64.exe release/desktop/
          cd release/desktop
          sha256sum *.exe > SHA256SUMS.txt
          gh release upload athlys-windows-latest *.exe SHA256SUMS.txt --clobber --repo Lijw936/Athlys-downloads
      - name: Publish Athlys Club release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/club
          cp desktop-club/dist/Athlys-Club-1.0.1-x64.exe desktop-club/dist/Athlys-Club-Portable-1.0.1-x64.exe release/club/
          cd release/club
          sha256sum *.exe > SHA256SUMS.txt
          gh release upload athlys-club-windows-latest *.exe SHA256SUMS.txt --clobber --repo Lijw936/Athlys-downloads
      - name: Verify public Windows download URLs
        run: |
          for asset in \
            Athlys-1.2.1-x64.exe \
            Athlys-Portable-1.2.1-x64.exe \
            Athlys-Club-1.0.1-x64.exe \
            Athlys-Club-Portable-1.0.1-x64.exe; do
            case "$asset" in
              Athlys-Club*) tag=athlys-club-windows-latest ;;
              *) tag=athlys-windows-latest ;;
            esac
            url="https://github.com/Lijw936/Athlys-downloads/releases/download/$tag/$asset"
            code="$(curl --silent --show-error --head --location --output /dev/null --write-out '%{http_code}' --max-time 60 "$url")"
            test "$code" = "200" || { echo "Asset verification failed: $asset (HTTP $code)"; exit 1; }
          done
